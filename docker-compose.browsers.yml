services:
  phantomjs:
    image: wernight/phantomjs:2
    command: [ "phantomjs", "--webdriver=8643" ]
    volumes:
      - "./core/tests:/srv/core/tests"

  chrome:
    image: selenium/standalone-chrome:148.0
    shm_size: '2gb'
    environment:
      SE_OPTS: "--enable-managed-downloads true"
      SE_SESSION_REQUEST_TIMEOUT: 300
    volumes:
      - "./core/tests:/srv/core/tests"

  # Selenium Grid — for future parallel Acceptance execution.
  # Each Codeception process uses one WebDriver session; to parallelise,
  # split feature files across N processes, each hitting the hub.
  #
  # selenium-hub:
  #   image: selenium/hub:4.44.0
  #   ports:
  #     - "4442:4442"
  #     - "4443:4443"
  #     - "4444:4444"
  #   environment:
  #     SE_SESSION_REQUEST_TIMEOUT: 300
  #     SE_NODE_SESSION_TIMEOUT: 300
  #
  # chrome-node:
  #   image: selenium/node-chrome:148.0
  #   depends_on:
  #     - selenium-hub
  #   environment:
  #     SE_EVENT_BUS_HOST: selenium-hub
  #     SE_EVENT_BUS_PUBLISH_PORT: 4442
  #     SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
  #     SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
  #     SE_NODE_MAX_SESSIONS: 1
  #     DBUS_SESSION_BUS_ADDRESS: "/dev/null"
  #   shm_size: '2gb'
  #   privileged: true
  #   volumes:
  #     - "./core/tests:/srv/core/tests"

  firefox:
    image: selenium/standalone-firefox:151.0
    environment:
      SE_OPTS: "-enablePassThrough false"
    shm_size: '2gb'
    volumes:
      - "./core/tests:/srv/core/tests"

  wait:
    image: jwilder/dockerize
