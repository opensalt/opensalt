# Development environment override
services:
  scheduler:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./core:/srv/core:rw
      - ./core/docker/php/conf.d/opcache.ini.dev:/usr/local/etc/php/conf.d/opcache.ini

  web:
    build:
      context: ./core
      target: salt_core_dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MERCURE_EXTRA_DIRECTIVES: demo
    #environment:
      # See https://docs.docker.com/docker-for-mac/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host
      # See https://github.com/docker/for-linux/issues/264
      # The `remote_host` below may optionally be replaced with `remote_connect_back`
      # XDEBUG_MODE required for step debugging
      #XDEBUG_MODE: debug
      # default port for Xdebug 3 is 9003
      # idekey=VSCODE if you are debugging with VSCode
      #XDEBUG_CONFIG: >-
      #  client_host=host.docker.internal
      #  idekey=PHPSTORM
      # This should correspond to the server declared in PHPStorm `Preferences | Languages & Frameworks | PHP | Servers`
      # Then PHPStorm will use the corresponding path mappings
      #PHP_IDE_CONFIG: serverName=api-platform
    volumes:
      - ./core:/srv/core:rw
      - ./core/docker/php/conf.d/opcache.ini.dev:/usr/local/etc/php/conf.d/opcache.ini
      - ./core/frankenphp/Caddyfile.dev:/etc/caddy/Caddyfile
      - ./core/var:/srv/core/var:rw
    healthcheck:
      start_period: 10m # For data migration
      interval: 30s
      timeout: 3s
      retries: 5


  editor:
    image: node:24
    user: node:node
    volumes:
      - ./editor:/editor
    command: ['/editor/run_dev.sh']

  db:
    volumes:
      - ./db-init.d:/docker-entrypoint-initdb.d

