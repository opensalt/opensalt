on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - '**:**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  release:
    types: [published]
#  schedule:
#    - cron: '0 7 * * 1'  # Weekly on Mondays at 7 AM UTC

name: Build and Test

jobs:
  build:
    name: Build OpenSALT
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: "docker-compose.yml:docker-compose.test.yml"
      RUN_TEST_ARGS: ${{ secrets.RUN_TEST_ARGS }}
      DEFAULT_RUN_TEST_ARGS: "--fail-fast --steps -x incomplete -x duplicate -x skip -x skip-firefox -x 0117-0708 -x 0108-0801 -x 1013-1444 -x change-notification"
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout
        uses: actions/checkout@v6

      # https://github.com/marketplace/actions/docker-layer-caching
      # Pull the latest image to build, and avoid caching pull-only images.
      # (docker pull is faster than caching in most cases.)
      - name: Pull images
        env:
          REPO: opensalt/opensalt
        run: |
          env
          cp -f .env.test .env
          docker pull $REPO:web-develop
          docker pull $REPO:db-develop
#      # In this step, this action saves a list of existing images,
#      # the cache is created without them in the post run.
#      # It also restores the cache if it exists.
#      - name: Cache docker layers
#        uses: satackey/action-docker-layer-caching@v0.0.11
#        # Ignore the failure of a step and avoid terminating the job.
#        continue-on-error: true
#        with:
#          key: opensalt-docker-cache-{hash}
#          restore-keys: |
#            opensalt-docker-cache-

      - name: Build the images
        run: |
          BUILD_NUMBER=${GITHUB_RUN_NUMBER} COMMIT=${GITHUB_SHA::8} make docker-build

      # - name: Run Trivy vulnerability scanner
      #   if: github.event_name != 'schedule'
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: 'opensalt/opensalt:web-4.x'
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'HIGH,CRITICAL'
      #     exit-code: '1'
      #
      # - name: Upload Trivy scan results to GitHub Security tab
      #   if: always() && github.event_name != 'schedule'
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: 'trivy-results.sarif'
      #
      # - name: Generate SBOM
      #   if: always() && github.event_name != 'schedule'
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: 'opensalt/opensalt:web-4.x'
      #     format: 'cyclonedx'
      #     output: 'sbom.json'
      #
      # - name: Upload SBOM artifact
      #   if: always() && github.event_name != 'schedule'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sbom-cyclonedx
      #     path: sbom.json

      - name: Bring up db container
        run: |
          docker compose up -d --wait --wait-timeout 60 db
          sleep 30

      - name: Initialize db schema
        run: |
          docker compose run --rm --no-deps web ./bin/console --env=prod doctrine:migrations:migrate --no-interaction

      - name: Lint Twig templates
        run: docker compose exec web ./bin/console --env=prod lint:twig templates/

      - name: Lint YAML config
        run: docker compose exec web ./bin/console --env=prod lint:yaml config/

      - name: Lint container
        run: docker compose exec web ./bin/console --env=prod lint:container

      - name: Validate Doctrine schema
        run: docker compose exec web ./bin/console --env=prod doctrine:schema:validate

      - name: Bring up the web container
        run: |
          docker compose up -d --no-recreate --wait --wait-timeout 60 web
          sleep 10
          docker compose ps

      - name: Initialize db data
        run: |
          docker compose exec web ./bin/console --env=prod import:generic-csv tests/Support/Data/test_items.csv

      - name: Run tests
        run: ./core/bin/run-tests --debug ${RUN_TEST_ARGS:-$DEFAULT_RUN_TEST_ARGS} -x skip-ci

      - name: Run PHPUnit unit tests
        working-directory: core
        run: ./bin/run-tests Unit

      # PARALLEL ALTERNATIVE:
      #   1. Uncomment the PARALLEL_ACCEPTANCE_JOBS var below and set to 2 (or more).
      #   2. Replace the two steps above with:
      #        - name: Run all tests in parallel
      #          working-directory: core
      #          env:
      #            PARALLEL_ACCEPTANCE_JOBS: 2
      #          run: ./bin/run-tests-parallel --debug ${RUN_TEST_ARGS:-$DEFAULT_RUN_TEST_ARGS} -x skip-ci
      #   The run-tests-parallel script starts the Selenium Grid automatically.
      #   Scale chrome-node=N where N matches PARALLEL_ACCEPTANCE_JOBS (default 1).

      - name: Failed
        if: ${{ failure() }}
        run: |
          docker compose logs web db

      - name: Check DockerHub credentials
        id: check_docker_credentials
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "DockerHub credentials found, will proceed with login and push."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "DockerHub credentials not configured, skipping login and push."
          fi

      - name: Login to DockerHub
        if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.event_name == 'release') && steps.check_docker_credentials.outputs.has_credentials == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push develop
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && steps.check_docker_credentials.outputs.has_credentials == 'true'
        env:
          REPO: opensalt/opensalt
        run: |
          docker tag opensalt/opensalt:web-4.x $REPO:web-develop
          docker tag opensalt/opensalt:db-4.x $REPO:db-develop
          docker push $REPO:web-develop
          docker push $REPO:db-develop

      - name: Push latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.check_docker_credentials.outputs.has_credentials == 'true'
        env:
          REPO: opensalt/opensalt
        run: |
          docker tag opensalt/opensalt:web-4.x $REPO:web-latest
          docker tag opensalt/opensalt:db-4.x $REPO:db-latest
          docker push $REPO:web-latest
          docker push $REPO:db-latest

      - name: Push release
        if: github.event_name == 'release' && steps.check_docker_credentials.outputs.has_credentials == 'true'
        env:
          REPO: opensalt/opensalt
          TAG: ${GITHUB_REF/refs\/tags\//}
        run: |
          docker tag opensalt/opensalt:web-4.x $REPO:web-${TAG}
          docker tag opensalt/opensalt:db-4.x $REPO:db-${TAG}
          docker push $REPO:web-${TAG}
          docker push $REPO:db-${TAG}

      - name: Bring down the stack
        if: ${{ always() }}
        run: |
          docker compose down -v
