novaway_feature_flag:
    default_manager: default
    managers:
        default:
            factory: 'novaway_feature_flag.factory.array'
            options:
                features:
                    comments:
                        enabled: '%comments_feature%'
                        description: Allow comments
                    comment_attachments:
                        enabled: '%comment_attachments%'
                        description: Allow comments to have attachments
                    create_account:
                        enabled: '%create_account_feature%'
                        description: Allow self-creation of accounts
                    email_feature:
                        enabled: '%use_mail_feature%'
                        description: Allow sending emails
                    mfa:
                        enabled: '%use_mfa%'
                        description: Use MFA for authentication
                    editor_local_framework_db:
                        enabled: '%editor_local_framework_db%'
                        description: Use PGlite-backed local framework DB
                    editor_local_association_queries:
                        enabled: '%editor_local_association_queries%'
                        description: Read item associations from local DB
                    editor_local_tree_queries:
                        enabled: '%editor_local_tree_queries%'
                        description: Read tree search from local DB
                    editor_local_similarity_search:
                        enabled: '%editor_local_similarity_search%'
                        description: Enable local similarity search scaffolding
