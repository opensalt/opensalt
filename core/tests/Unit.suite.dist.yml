actor: UnitTester
modules:
    enabled:
        - Symfony:
            app_path: 'src'
            var_path: 'var'
            environment: 'test'
            part: SERVICES
        - Doctrine:
            depends: Symfony
            cleanup: true
        - Tests\Support\Helper\Unit
        - Tests\Support\Helper\UserManagement
step_decorators: ~
